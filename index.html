<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de WOD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500;700&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0c0b0a;
    --black-2:#161412;
    --black-3:#211d19;
    --orange:#ff5a1f;
    --orange-2:#ff7a3d;
    --orange-dim:#7a2e10;
    --paper:#f3ede0;
    --paper-dim:#c9c0ac;
    --line:#3a332c;
    --green:#7fae52;
    --amber:#e0a537;
    --red:#c9482f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--black);
    background-image:
      repeating-linear-gradient(135deg, rgba(255,90,31,0.035) 0px, rgba(255,90,31,0.035) 2px, transparent 2px, transparent 26px);
    color:var(--paper);
    font-family:'Archivo', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:28px 18px 80px;
  }

  /* ---------- header ---------- */
  header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    border-bottom:3px solid var(--orange);
    padding-bottom:14px;
    margin-bottom:26px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .brand-mark{
    width:38px;height:38px;
    flex:none;
  }
  h1{
    font-family:'Anton', sans-serif;
    font-weight:400;
    font-size:clamp(28px, 7vw, 40px);
    letter-spacing:1px;
    margin:0;
    line-height:0.9;
    color:var(--paper);
    text-transform:uppercase;
  }
  h1 span{color:var(--orange);}
  .tagline{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--orange-2);
    margin-top:2px;
  }
  .count-badge{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--paper-dim);
    text-align:right;
    letter-spacing:0.5px;
    white-space:nowrap;
  }
  .count-badge b{color:var(--orange-2); font-size:16px;}

  /* ---------- filters ---------- */
  .panel{
    background:var(--black-2);
    border:1px solid var(--line);
    padding:18px;
    margin-bottom:20px;
  }
  .panel-title{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--paper-dim);
    margin:0 0 14px 0;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .panel-title::before{
    content:'';
    width:8px;height:8px;
    background:var(--orange);
    display:inline-block;
  }
  .field{
    margin-bottom:16px;
  }
  .field:last-child{margin-bottom:0;}
  .field label{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--paper-dim);
    margin-bottom:8px;
  }
  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .chip{
    appearance:none;
    background:var(--black-3);
    border:1px solid var(--line);
    color:var(--paper);
    font-family:'Archivo', sans-serif;
    font-weight:600;
    font-size:13.5px;
    padding:9px 14px;
    cursor:pointer;
    transition:all .12s ease;
    text-transform:uppercase;
    letter-spacing:0.3px;
  }
  .chip:hover{border-color:var(--orange-2);}
  .chip.active{
    background:var(--orange);
    border-color:var(--orange);
    color:var(--black);
  }
  .chip.dif-facil.active{background:var(--green); border-color:var(--green); color:var(--black);}
  .chip.dif-moderado.active{background:var(--amber); border-color:var(--amber); color:var(--black);}
  .chip.dif-dificil.active{background:var(--red); border-color:var(--red); color:var(--paper);}

  /* ---------- action button ---------- */
  .roll-btn{
    width:100%;
    background:var(--orange);
    color:var(--black);
    border:none;
    font-family:'Anton', sans-serif;
    font-size:22px;
    letter-spacing:2px;
    text-transform:uppercase;
    padding:18px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    transition:transform .08s ease, background .12s ease;
    position:relative;
    overflow:hidden;
  }
  .roll-btn:hover{background:var(--orange-2);}
  .roll-btn:active{transform:scale(0.985);}
  .roll-btn svg{width:22px;height:22px;flex:none;}
  .roll-btn.rolling svg{animation:spin .5s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- result card ---------- */
  #result{margin-top:24px;}
  .empty-state{
    border:1px dashed var(--line);
    padding:40px 20px;
    text-align:center;
    color:var(--paper-dim);
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    letter-spacing:1px;
    text-transform:uppercase;
  }
  .no-match{
    border:1px solid var(--red);
    background:rgba(201,72,47,0.08);
    padding:20px;
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    color:var(--paper);
    letter-spacing:0.5px;
  }
  .card{
    background:var(--black-2);
    border:1px solid var(--line);
    border-top:5px solid var(--orange);
    padding:26px 24px 22px;
    animation:reveal .3s ease;
  }
  @keyframes reveal{
    from{opacity:0; transform:translateY(8px);}
    to{opacity:1; transform:translateY(0);}
  }
  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    margin-bottom:6px;
  }
  .wod-num{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--paper-dim);
    letter-spacing:1px;
  }
  .diff-tag{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    padding:4px 9px;
    font-weight:700;
    color:var(--black);
    flex:none;
  }
  .diff-facil{background:var(--green);}
  .diff-moderado{background:var(--amber);}
  .diff-dificil{background:var(--red); color:var(--paper);}

  .wod-name{
    font-family:'Anton', sans-serif;
    font-size:clamp(26px, 6vw, 34px);
    text-transform:uppercase;
    letter-spacing:0.5px;
    margin:2px 0 14px 0;
    line-height:1;
    color:var(--paper);
  }
  .scheme-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .scheme-badge{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:14px;
    background:var(--orange);
    color:var(--black);
    padding:6px 12px;
    letter-spacing:0.5px;
  }
  .scheme-time{
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    color:var(--orange-2);
    border:1px solid var(--orange-dim);
    padding:5px 11px;
  }
  .movements{
    list-style:none;
    margin:0 0 16px 0;
    padding:0;
    border-top:1px solid var(--line);
  }
  .movements li{
    padding:10px 0;
    border-bottom:1px solid var(--line);
    font-size:15.5px;
    font-weight:500;
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .movements li::before{
    content:'';
    width:6px;height:6px;
    background:var(--orange);
    flex:none;
    transform:translateY(-2px);
  }
  .movements li .sub{
    color:var(--paper-dim);
    font-size:12.5px;
    font-family:'JetBrains Mono', monospace;
    display:block;
    margin-top:2px;
  }
  .movements li.line-label{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--orange-2);
    text-transform:uppercase;
    letter-spacing:1px;
    padding-top:14px;
  }
  .movements li.line-label::before{display:none;}
  .notes{
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    color:var(--paper-dim);
    line-height:1.6;
    border-left:2px solid var(--orange-dim);
    padding-left:12px;
  }
  .notes b{color:var(--orange-2);}

  footer{
    margin-top:40px;
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--line);
  }

  @media (max-width:480px){
    .panel{padding:14px;}
    .card{padding:20px 16px 18px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 48 48" fill="none">

  </div>

  <button class="roll-btn" id="rollBtn">

      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <circle cx="8" cy="8" r="1.2" fill="currentColor" stroke="none"/>
      <circle cx="16" cy="8" r="1.2" fill="currentColor" stroke="none"/>
      <circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/>
      <circle cx="8" cy="16" r="1.2" fill="currentColor" stroke="none"/>
      <circle cx="16" cy="16" r="1.2" fill="currentColor" stroke="none"/>

    Tirar WOD
  </button>

  <div id="result">
    <div class="empty-state">Elegí los filtros y tocá "Tirar WOD"</div>
  </div>

  <footer>WOD/RANDOM &mdash; biblioteca propia de circuitos</footer>
</div>

// ============================================================
// App logic
// ============================================================

const FORMATOS = [
  { key: "ANY", label: "Todos" },
  { key: "A_COMPLETAR", label: "A Completar" },
  { key: "FOR_TIME", label: "For Time" },
  { key: "EMOM", label: "EMOM" },
  { key: "AMRAP", label: "AMRAP" },
  { key: "TABATA", label: "Tabata" },
];

const DIFICULTADES = [
  { key: "ANY", label: "Cualquiera", cls: "" },
  { key: "facil", label: "Fácil", cls: "dif-facil" },
  { key: "moderado", label: "Moderado", cls: "dif-moderado" },
  { key: "dificil", label: "Difícil", cls: "dif-dificil" },
];

const state = {
  formato: "ANY",
  tiempo: "ANY",
  dificultad: "ANY",
};

// Historial de usados por combinación de filtros, para no repetir hasta agotar
const usedHistory = {};

function getTiempoOptions() {
  const set = new Set(WODS.map(w => w.duration));
  return Array.from(set).sort((a, b) => a - b);
}

function buildChipRow(container, options, stateKey, getLabel, getCls) {
  container.innerHTML = "";
  options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "chip";
    if (getCls) {
      const c = getCls(opt);
      if (c) btn.classList.add(c);
    }
    btn.textContent = getLabel(opt);
    btn.dataset.value = opt.key !== undefined ? opt.key : opt;
    if (state[stateKey] === btn.dataset.value) btn.classList.add("active");
    btn.addEventListener("click", () => {
      state[stateKey] = btn.dataset.value;
      container.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
      btn.classList.add("active");
    });
    container.appendChild(btn);
  });
}

function initFilters() {
  buildChipRow(
    document.getElementById("formatoRow"),
    FORMATOS,
    "formato",
    o => o.label
  );

  const tiempos = [{ key: "ANY", label: "Cualquiera" }, ...getTiempoOptions().map(t => ({ key: String(t), label: t + "'" }))];
  buildChipRow(
    document.getElementById("tiempoRow"),
    tiempos,
    "tiempo",
    o => o.label
  );

  buildChipRow(
    document.getElementById("dificultadRow"),
    DIFICULTADES,
    "dificultad",
    o => o.label,
    o => o.cls
  );

  document.getElementById("totalCount").textContent = WODS.length;
}

function matchesFilters(w) {
  if (state.formato !== "ANY" && w.format !== state.formato) return false;
  if (state.tiempo !== "ANY" && String(w.duration) !== state.tiempo) return false;
  if (state.dificultad !== "ANY" && w.difficulty !== state.dificultad) return false;
  return true;
}

function filterKey() {
  return `${state.formato}|${state.tiempo}|${state.dificultad}`;
}

function pickRandomWod() {
  const pool = WODS.filter(matchesFilters);
  if (pool.length === 0) return { pool, picked: null };

  const key = filterKey();
  if (!usedHistory[key]) usedHistory[key] = new Set();
  let used = usedHistory[key];

  let candidates = pool.filter(w => !used.has(w.id));
  if (candidates.length === 0) {
    used.clear();
    candidates = pool;
  }

  const picked = candidates[Math.floor(Math.random() * candidates.length)];
  used.add(picked.id);
  return { pool, picked };
}

const DIFF_LABELS = { facil: "Fácil", moderado: "Moderado", dificil: "Difícil" };
const FORMAT_LABELS = {
  AMRAP: "AMRAP", EMOM: "EMOM", FOR_TIME: "For Time",
  TABATA: "Tabata", A_COMPLETAR: "A Completar"
};

function renderWod(w) {
  const el = document.getElementById("result");
  const movementsHtml = w.movements.map(m => `<li>${escapeHtml(m)}</li>`).join("");
  const notesHtml = w.notes ? `<div class="notes"><b>Nota:</b> ${escapeHtml(w.notes)}</div>` : "";

  el.innerHTML = `
    <div class="card">
      <div class="card-top">
        <span class="wod-num">WOD #${String(w.id).padStart(2, "0")}</span>
        <span class="diff-tag diff-${w.difficulty}">${DIFF_LABELS[w.difficulty]}</span>
      </div>
      <h2 class="wod-name">${escapeHtml(w.name)}</h2>
      <div class="scheme-row">
        <span class="scheme-badge">${FORMAT_LABELS[w.format]}</span>
        <span class="scheme-time">${escapeHtml(w.scheme)}</span>
      </div>
      <ul class="movements">${movementsHtml}</ul>
      ${notesHtml}
    </div>
  `;
}

function renderNoMatch() {
  const el = document.getElementById("result");
  el.innerHTML = `<div class="no-match">No hay WODs cargados todavía con esta combinación de filtros.<br>Probá otra combinación.</div>`;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function handleRoll() {
  const btn = document.getElementById("rollBtn");
  btn.classList.add("rolling");
  btn.disabled = true;

  setTimeout(() => {
    const { picked } = pickRandomWod();
    if (!picked) {
      renderNoMatch();
    } else {
      renderWod(picked);
    }
    btn.classList.remove("rolling");
    btn.disabled = false;
  }, 260);
}

document.addEventListener("DOMContentLoaded", () => {
  initFilters();
  document.getElementById("rollBtn").addEventListener("click", handleRoll);
});
